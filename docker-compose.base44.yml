services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      # Platform-provided at runtime; used to allow the preview origin in Next dev.
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults # repo placeholders — app boots without credentials
      - /run/base44/app.env     # platform secrets — LAST, always wins
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    restart: unless-stopped
